<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>מעביר אותך ל-Linktree…</title>
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.google-analytics.com" />

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-34DFKV9RWM"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-34DFKV9RWM", { send_page_view: false });

      const destination = "https://linktr.ee/AlmogZeroToHero";
      const params = new URLSearchParams(window.location.search);
      const referralSource =
        params.get("utm_source") ||
        params.get("source") ||
        params.get("ref") ||
        "unknown";
      let hasRedirected = false;

      function redirectToLinktree() {
        if (hasRedirected) return;
        hasRedirected = true;
        window.location.replace(destination);
      }

      gtag("event", "linktree_redirect", {
        referral_source: referralSource,
        transport_type: "beacon",
        event_callback: redirectToLinktree,
        event_timeout: 600,
      });

      window.setTimeout(redirectToLinktree, 700);
    </script>

    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        color: #202124;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        padding: 2rem;
        text-align: center;
      }

      a {
        color: #0759c7;
      }
    </style>
  </head>
  <body>
    <main>
      <p>מעביר אותך ל-Linktree…</p>
      <noscript>
        <p>
          JavaScript כבוי בדפדפן.
          <a href="https://linktr.ee/AlmogZeroToHero">לחיצה כאן תמשיך ל-Linktree</a>.
        </p>
      </noscript>
    </main>
  </body>
</html>
