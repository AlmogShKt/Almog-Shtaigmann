name: Site integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  links:
    name: Validate GitHub Pages references
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check local links and assets
        run: node scripts/check-site-links.mjs

      - name: Check JavaScript syntax
        run: find assets/js pages/Course/salaries -name '*.js' -print0 | xargs -0 -n1 node --check
